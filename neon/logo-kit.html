document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0,132 L705,74 L825,128 L945,100 L1065,126 L1165,114\"><\u002Fpath><circle cx=\"470\" cy=\"42\" r=\"8\"><\u002Fcircle><\u002Fg><\u002Fsvg><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- LIT -->\n  <div style=\"font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#7a7c80;margin-bottom:16px\">02 · Lit — <span style=\"color:#00d4ff\">.neon<\u002Fspan> + independent flicker<\u002Fdiv>\n  <div style=\"border:1px solid #1c1e22;background:#0b0c0e;padding:46px 24px;display:flex;align-items:center;justify-content:center;min-height:140px;margin-bottom:14px;overflow:hidden\"><span class=\"co-wm neon\" style=\"font-size:40px\"><span class=\"co-cyber flick-c\">CYBER<\u002Fspan><span class=\"co-off flick-o\" style=\"font-size:1.9em\">Offroading<\u002Fspan><\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:46px\">\n    <div style=\"border:1px solid #1c1e22;background:#0b0c0e;padding:38px 24px 30px;display:flex;align-items:center;justify-content:center;min-height:150px;overflow:hidden\"><span class=\"co-wm stack neon\" style=\"font-size:30px\"><span class=\"co-cyber flick-c\">CYBER<\u002Fspan><span class=\"co-off flick-o\" style=\"font-size:1.95em\">Offroading<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <div style=\"border:1px solid #1c1e22;background:#0b0c0e;padding:38px 24px 30px;display:flex;align-items:center;justify-content:center;min-height:150px;overflow:hidden\"><svg class=\"co-mark neon\" viewBox=\"0 0 1200 169\" width=\"210\" fill=\"none\" style=\"overflow:visible\" aria-label=\"mark\"><defs><clipPath id=\"klW\"><path d=\"M0,159 L480,10 L1200,105 Z\"><\u002Fpath><\u002FclipPath><\u002Fdefs><g class=\"mk-cyan flick-c\" stroke-width=\"7\" stroke-linejoin=\"miter\"><path d=\"M0,159 L480,10 L1200,105 Z\"><\u002Fpath><\u002Fg><g class=\"mk-red flick-o\" clip-path=\"url(#klW)\" stroke-width=\"6\" stroke-linejoin=\"miter\"><path d=\"M130,150 L235,106 L345,140 L470,42 L590,132 L705,74 L825,128 L945,100 L1065,126 L1165,114\"><\u002Fpath><circle cx=\"470\" cy=\"42\" r=\"8\"><\u002Fcircle><\u002Fg><\u002Fsvg><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- CODE -->\n  <div style=\"font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#7a7c80;margin-bottom:16px\">03 · Drop-in code<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:14px\">\n    <div style=\"border:1px solid #1c1e22;background:#0b0c0e\">\n      <div style=\"font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#00d4ff;padding:11px 16px;border-bottom:1px solid #1c1e22\">styles.css<\u002Fdiv>\n      <pre style=\"margin:0;padding:18px 20px;overflow:auto;font:12px/1.7 'IBM Plex Mono',monospace;color:#9aa0a6;white-space:pre\">@import url('https://fonts.googleapis.com/css2?family=Audiowide&amp;family=Yellowtail&amp;display=swap');\n\n/* base logo — flat, brand colours */\n.co-wm{display:inline-flex;align-items:baseline;line-height:1}\n.co-wm.stack{flex-direction:column;align-items:flex-start}\n.co-cyber{font-family:'Audiowide',sans-serif;color:#00d4ff;\n  letter-spacing:.16em;padding-left:.16em}\n.co-off{font-family:'Yellowtail',cursive;color:#ff2a2a;\n  margin-left:.05em;line-height:.7}\n.co-wm.stack .co-off{margin-left:0;line-height:.82}\n.mk-cyan{stroke:#00d4ff} .mk-red{stroke:#ff2a2a}\n.mk-red circle{fill:#ff2a2a;stroke:none}\n\n/* lit — wrap the logo in .neon to switch the tubes on */\n.neon .co-cyber{color:#f2feff;\n  text-shadow:0 0 4px #fff,0 0 14px #bfefff,0 0 30px #00d4ff,0 0 60px rgba(0,212,255,.5)}\n.neon .co-off{color:#fff2f2;\n  text-shadow:0 0 4px #fff,0 0 14px #ffb3b3,0 0 30px #ff2a2a,0 0 62px rgba(255,42,42,.46)}\n.neon .mk-cyan{stroke:#eafdff;\n  filter:drop-shadow(0 0 1.5px #eafdff) drop-shadow(0 0 5px #00d4ff)\n         drop-shadow(0 0 13px #00d4ff) drop-shadow(0 0 26px rgba(0,212,255,.5))}\n.neon .mk-red{stroke:#ffecec;\n  filter:drop-shadow(0 0 1.5px #ffd9d9) drop-shadow(0 0 5px #ff2a2a)\n         drop-shadow(0 0 12px #ff2a2a) drop-shadow(0 0 24px rgba(255,42,42,.45))}\n.neon .mk-red circle{fill:#ffecec}\n\n/* independent flicker — cyan + red on different rhythms */\n.flick-c{animation:nflick  7s   linear infinite}\n.flick-o{animation:nflick2 6.4s linear infinite .5s}\n@keyframes nflick{0%,3%,6%,100%{opacity:1}4%{opacity:.45}5%{opacity:.9}\n  42%{opacity:1}43%{opacity:.5}44%{opacity:1}\n  73%{opacity:1}74%{opacity:.3}75.5%{opacity:1}76%{opacity:.7}77%{opacity:1}}\n@keyframes nflick2{0%,9%,12%,100%{opacity:1}10%{opacity:.4}11%{opacity:.85}\n  33%{opacity:1}34%{opacity:.55}35.5%{opacity:1}\n  63%{opacity:1}64%{opacity:.3}65%{opacity:.9}66%{opacity:.5}67%{opacity:1}}\n@media (prefers-reduced-motion:reduce){.flick-c,.flick-o{animation:none}}<\u002Fpre>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #1c1e22;background:#0b0c0e\">\n      <div style=\"font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#00d4ff;padding:11px 16px;border-bottom:1px solid #1c1e22\">markup.html<\u002Fdiv>\n      <pre style=\"margin:0;padding:18px 20px;overflow:auto;font:12px/1.7 'IBM Plex Mono',monospace;color:#9aa0a6;white-space:pre\">&lt;!-- WORDMARK · inline (left/right). Drop .neon to show it unlit. --&gt;\n&lt;span class=\"co-wm neon\" style=\"font-size:42px\"&gt;\n  &lt;span class=\"co-cyber flick-c\"&gt;CYBER&lt;/span&gt;\n  &lt;span class=\"co-off flick-o\" style=\"font-size:1.9em\"&gt;Offroading&lt;/span&gt;\n&lt;/span&gt;\n\n&lt;!-- WORDMARK · stacked (top/bottom) --&gt;\n&lt;span class=\"co-wm stack neon\" style=\"font-size:64px\"&gt;\n  &lt;span class=\"co-cyber flick-c\"&gt;CYBER&lt;/span&gt;\n  &lt;span class=\"co-off flick-o\" style=\"font-size:1.95em\"&gt;Offroading&lt;/span&gt;\n&lt;/span&gt;\n\n&lt;!-- MARK · inline SVG so each tube can glow + flicker on its own --&gt;\n&lt;svg class=\"co-mark neon\" viewBox=\"0 0 1200 169\" width=\"260\" fill=\"none\"\n     style=\"overflow:visible\" aria-label=\"CyberOffroading\"&gt;\n  &lt;defs&gt;&lt;clipPath id=\"cw\"&gt;&lt;path d=\"M0,159 L480,10 L1200,105 Z\"/&gt;&lt;/clipPath&gt;&lt;/defs&gt;\n  &lt;g class=\"mk-cyan flick-c\" stroke-width=\"7\" stroke-linejoin=\"miter\"&gt;\n    &lt;path d=\"M0,159 L480,10 L1200,105 Z\"/&gt;\n  &lt;/g&gt;\n  &lt;g class=\"mk-red flick-o\" clip-path=\"url(#cw)\" stroke-width=\"6\" stroke-linejoin=\"miter\"&gt;\n    &lt;path d=\"M130,150 L235,106 L345,140 L470,42 L590,132 L705,74 L825,128 L945,100 L1065,126 L1165,114\"/&gt;\n    &lt;circle cx=\"470\" cy=\"42\" r=\"8\"/&gt;\n  &lt;/g&gt;\n&lt;/svg&gt;<\u002Fpre>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- NOTES -->\n  <div style=\"font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#7a7c80;margin:40px 0 16px\">04 · Notes<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;font-size:12px;line-height:1.7;color:#8a8c90\">\n    <div style=\"border:1px solid #1c1e22;background:#0b0c0e;padding:18px 20px\"><div style=\"color:#edede7;margin-bottom:7px\">Independent flicker<\u002Fdiv>CYBER runs <span style=\"color:#00d4ff\">.flick-c<\u002Fspan> (7s), Offroading <span style=\"color:#ff6b6b\">.flick-o<\u002Fspan> (6.4s, +0.5s) — different periods so the two tubes never sync. Put the same classes on the mark's cyan and red groups.<\u002Fdiv>\n    <div style=\"border:1px solid #1c1e22;background:#0b0c0e;padding:18px 20px\"><div style=\"color:#edede7;margin-bottom:7px\">Size &amp; layout<\u002Fdiv>Size with one <span style=\"color:#c8c8c0\">font-size<\u002Fspan> on <span style=\"color:#00d4ff\">.co-wm<\u002Fspan>; the script is ~1.9× CYBER. Mark scales by its <span style=\"color:#c8c8c0\">width<\u002Fspan>. Keep <span style=\"color:#c8c8c0\">overflow:visible<\u002Fspan> so glow isn't clipped.<\u002Fdiv>\n    <div style=\"border:1px solid #1c1e22;background:#0b0c0e;padding:18px 20px\"><div style=\"color:#edede7;margin-bottom:7px\">Mono / print<\u002Fdiv>Skip <span style=\"color:#00d4ff\">.neon<\u002Fspan> and set both colours to <span style=\"color:#c8c8c0\">#c8c8c0<\u002Fspan> (stainless) or <span style=\"color:#c8c8c0\">#08090a<\u002Fspan> (black) for light backgrounds — no glow, single tone.<\u002Fdiv>\n    <div style=\"border:1px solid #1c1e22;background:#0b0c0e;padding:18px 20px\"><div style=\"color:#edede7;margin-bottom:7px\">Files<\u002Fdiv><span style=\"color:#c8c8c0\">images/brand/mark.svg<\u002Fspan> — flat mark for simple <span style=\"color:#c8c8c0\">&lt;img&gt;<\u002Fspan> use. Raster fallbacks: <span style=\"color:#c8c8c0\">hero-mark.png<\u002Fspan>, <span style=\"color:#c8c8c0\">wordmark-stacked/-inline.png<\u002Fspan> (transparent).<\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
